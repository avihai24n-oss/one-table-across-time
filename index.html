<title>One Table Across Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,900;1,500&family=Archivo:wght@400;500;600&family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@300;400;600&display=swap">

<style>
:root{
  --ground:#16120E;
  --panel:#201A12;
  --panel-2:#1B1610;
  --band:#301D0E;
  --line:#33281A;
  --text:#ECE2D2;
  --text-2:#D8CDBB;
  --muted:#9A8B76;
  --dim:#7A5236;
  --accent:#F97316;
  --f-display:"Playfair Display","Frank Ruhl Libre",Georgia,serif;
  --f-body:"Archivo","Assistant","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--text-2);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0}

/* tab bar */
.bar{position:sticky;top:0;z-index:10;background:rgba(22,18,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:8px}
.tab{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.06em;
  padding:8px 20px;border-radius:2px;cursor:pointer;transition:color .12s,border-color .12s;
}
.tab:hover{color:var(--text-2);border-color:var(--dim)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#16120E}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.langsw{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.langsw button{background:transparent;border:0;color:var(--muted);font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:8px 13px;cursor:pointer}
.langsw button+button{border-inline-start:1px solid var(--line)}
.langsw button:hover{color:var(--text)}
.langsw button.on{background:var(--accent);color:#16120E}
.langnote{margin:0 0 6px;padding:9px 14px;border-inline-start:3px solid #E2DCD1;background:#FAF7F1;font-size:12.5px;color:#8B857A}
.printbtn{margin-inline-start:12px;background:transparent;border:1px solid var(--dim);color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:600;padding:8px 16px;border-radius:2px;cursor:pointer}
.printbtn:hover{color:var(--text);border-color:var(--accent)}

.wrap{max-width:1000px;margin:0 auto;padding:36px 24px 80px}
.pane[hidden]{display:none!important}


.slot{position:relative}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot.filled .ic,.slot.filled .lb{display:none}

.assets{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}
.as{background:var(--panel-2);padding:10px 12px;min-height:76px}
.as .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:7px}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tb{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);display:block;overflow:hidden;flex:none}
.tb.wide{width:66px}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .vid{width:100%;max-width:150px;border:1px solid var(--line);background:#000;display:none}
.thumbs .vid.filled{display:block}
.empty-hint{font-size:10.5px;color:var(--dim);font-style:italic}
.as:has(.tb.filled) .empty-hint,.as:has(.vid.filled) .empty-hint{display:none}
@media (max-width:820px){.assets{grid-template-columns:1fr 1fr}}


/* ===== research ===== */
#p-res .mkleg{display:inline-flex;align-items:center;font-size:12px;color:var(--rbody);margin-inline-end:16px}
#p-res .mk{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:700;margin-inline-end:7px;vertical-align:-3px;flex:none}
#p-res .mk.yes{background:#E4F0E7;color:#2F6B3A;border:1px solid #BCD4C1}
#p-res .mk.no{background:#FBE9E3;color:#A33D1E;border:1px solid #E6C4B8}
#p-res .shot:has(.mk.no) img{opacity:.82}

#p-res .onebullet{padding:13px 18px;border-bottom:1px solid var(--rline);font-size:14px;line-height:1.75;color:var(--rbody);position:relative;padding-inline-start:34px}
#p-res .onebullet::before{content:"";position:absolute;inset-inline-start:18px;top:21px;width:6px;height:6px;border-radius:50%;background:var(--rmut)}
#p-res .onebullet b{color:var(--rink);font-weight:600}
#p-res .lightrow{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 18px;border-bottom:1px solid var(--rline);background:#FFFAF3}
#p-res .lk2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--racc);font-weight:700;padding-top:3px}
#p-res .lv2{font-size:14px;line-height:1.8;color:var(--rbody)}
#p-res .lv2 b{color:var(--rink);font-weight:600}
@media (max-width:820px){#p-res .lightrow{grid-template-columns:1fr;gap:5px}}

#p-res .legend2{display:grid;grid-template-columns:1fr;gap:1px;background:var(--rline);border:1px solid var(--rline);margin-top:14px}
#p-res .lg2{background:var(--rcard);padding:13px 16px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
#p-res .lg2h{width:100%;font-size:11.5px;color:var(--rmut);margin-bottom:4px}
#p-res .lg2h b{color:var(--rink);font-weight:600}
#p-res .legend2 .lic{position:static;display:inline-block;border:1px solid;border-radius:20px;padding:3px 11px;font-size:10px}

/* verdict = filled pill, square-ish, at the era header */
#p-res .vd{border-radius:3px;font-weight:700}
#p-res .vd.ok{color:#fff;background:#3F7A4C;border-color:#3F7A4C}
#p-res .vd.mix{color:#3A2E06;background:#E0B94A;border-color:#E0B94A}
#p-res .vd.bad{color:#fff;background:#B0472A;border-color:#B0472A}

/* licence = outlined rounded chip with a leading dot, never filled */
#p-res .lic{border-radius:20px;border:1px solid;background:transparent!important;font-weight:600;letter-spacing:.04em}
#p-res .lic::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px;vertical-align:middle;background:currentColor}
#p-res .lic.free{color:#3F7A4C;border-color:#BCD4C1}
#p-res .lic.edu{color:#8A6712;border-color:#E2D3A6}
#p-res .lic.clear{color:#B0472A;border-color:#E6C4B8}
#p-res .shot .lic{margin:0 10px 10px;align-self:flex-start;padding:4px 11px}
@media (max-width:820px){#p-res .legend2{grid-template-columns:1fr}}

.objname{padding:13px 18px;border-bottom:1px solid var(--line);background:var(--band);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.on-he{font-family:var(--f-display);font-size:19px;font-weight:900;color:var(--text)}
.on-en{font-size:12px;letter-spacing:.08em;color:var(--dim);direction:ltr}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.cm{padding:13px 18px;background:var(--panel-2)}
.ck{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.cm.scr .ck{color:var(--dim)}
.cm.real .ck{color:var(--accent)}
.cv{font-size:13.5px;line-height:1.7;color:var(--text-2)}
.cv b{color:var(--text);font-weight:600}
.cm.real.ok{box-shadow:inset 3px 0 0 #47603D}
.cm.real.mix{box-shadow:inset 3px 0 0 #6E5A28}
.cm.real.bad{box-shadow:inset 3px 0 0 #7A4433}
@media (max-width:820px){.cmp{grid-template-columns:1fr}}

.res-head{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.res-head p{margin:10px 0 0;font-size:14.5px;color:var(--muted);max-width:76ch;line-height:1.75}
.tally{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px;flex-wrap:wrap}
.ty{background:var(--panel);padding:12px 18px;flex:1 1 150px}
.ty .n{font-family:var(--f-display);font-size:24px;font-weight:900;color:var(--accent);line-height:1}
.ty .l{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}

.era{margin-top:34px;border:1px solid var(--line);background:var(--panel)}
.era-head{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.era-y{font-family:var(--f-display);font-size:23px;font-weight:900;color:var(--accent);line-height:1}
.era-p{font-size:14px;color:var(--text);font-weight:600}
.era-s{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:3px 8px;border-radius:2px}
.vd{margin-inline-start:auto;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:2px}
.vd.ok{color:#8FBF7A;border:1px solid #47603D}
.vd.bad{color:#E08A6E;border:1px solid #7A4433}
.vd.mix{color:#D9B85C;border:1px solid #6E5A28}

.find{padding:14px 18px;border-bottom:1px solid var(--line)}
.find li{font-size:14px;line-height:1.75;color:var(--text-2);margin-bottom:7px}
.find li:last-child{margin-bottom:0}
.find b{color:var(--text);font-weight:600}
.find .no{color:#E08A6E;font-weight:600}
.find .yes{color:#8FBF7A;font-weight:600}
.find ul{margin:0;padding-inline-start:18px}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:16px 18px}
.shots.one{grid-template-columns:minmax(0,420px)}
.shots.one .shot img{aspect-ratio:auto;max-height:340px;object-fit:contain;padding:8px}
.shots.one .cap{font-size:13px;line-height:1.65}
.note-row{padding:13px 18px;font-size:13.5px;color:var(--dim);font-style:italic;line-height:1.7;border-bottom:1px solid var(--line)}
.note-row b{color:var(--text-2);font-style:normal;font-weight:600}
.shot{border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column}
.shot img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#fff;cursor:zoom-in}
.shot .cap{padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--text-2);flex:1}
.lic{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-top:1px solid var(--line)}
.lic.free{color:#8FBF7A}
.lic.edu{color:#D9B85C}
.lic.clear{color:#E08A6E}

#lb{position:fixed;inset:0;background:rgba(10,8,6,.95);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;padding:24px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}


/* ===== research: light surface ===== */
body.res-mode{background:#F2EFE9}
#p-res{
  --rbg:#F2EFE9; --rcard:#FFFFFF; --rink:#1B1917; --rbody:#4C4740; --rmut:#8B857A;
  --rline:#E2DCD1; --racc:#B35A12; --rband:#FAF7F1;
  background:var(--rbg);color:var(--rbody);padding:0 0 40px;
}
#p-res .res-head{border-bottom:1px solid var(--rline);padding:34px 0 22px}
#p-res .res-head h2{color:var(--rink);font-size:30px}
#p-res .res-head p{color:var(--rmut)}
#p-res .res-head p b{color:var(--rink)}
#p-res .tally{background:var(--rline);border:1px solid var(--rline)}
#p-res .ty{background:var(--rcard)}
#p-res .ty .n{color:var(--racc)}
#p-res .ty .l{color:var(--rmut)}
#p-res .ty .l b{color:var(--rink)}

#p-res .era{border:1px solid var(--rline);background:var(--rcard);border-radius:3px;overflow:hidden;box-shadow:0 1px 2px rgba(27,25,23,.04)}
#p-res .era-head{background:var(--rband);border-bottom:1px solid var(--rline)}
#p-res .era-y{color:var(--racc)}
#p-res .era-p{color:var(--rink)}
#p-res .era-s{color:var(--rmut);border-color:var(--rline)}
#p-res .vd.ok{color:#2F6B3A;border-color:#B6CDB9;background:#EFF5F0}
#p-res .vd.mix{color:#8A6712;border-color:#E0D2A8;background:#FBF6E9}
#p-res .vd.bad{color:#A33D1E;border-color:#E8C6B8;background:#FBF0EC}

#p-res .objname{background:#FFF9F0;border-bottom:1px solid var(--rline)}
#p-res .on-he{color:var(--rink)}
#p-res .on-en{color:var(--rmut)}

#p-res .cmp{background:var(--rline);border-bottom:1px solid var(--rline)}
#p-res .cm{background:var(--rcard)}
#p-res .cm.scr{background:#FBFAF7}
#p-res .cm.scr .ck{color:var(--rmut)}
#p-res .cm.real .ck{color:var(--racc)}
#p-res .cv{color:var(--rbody)}
#p-res .cv b{color:var(--rink)}
#p-res .cm.real.ok{box-shadow:inset 3px 0 0 #4E8A58}
#p-res .cm.real.mix{box-shadow:inset 3px 0 0 #C2A03C}
#p-res .cm.real.bad{box-shadow:inset 3px 0 0 #C0603E}

#p-res .find{border-bottom:1px solid var(--rline)}
#p-res .find li{color:var(--rbody)}
#p-res .find b{color:var(--rink)}
#p-res .find .no{color:#A33D1E}
#p-res .find .yes{color:#2F6B3A}
#p-res .note-row{color:var(--rmut);border-bottom:1px solid var(--rline);background:#FBFAF7}
#p-res .note-row b{color:var(--rbody)}

#p-res .shots,#p-res .shots.one{display:flex;flex-wrap:wrap;gap:14px;padding:18px}
#p-res .shot{flex:1 1 0;min-width:190px;border:1px solid var(--rline);background:#FCFBF9;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
#p-res .shot:hover{box-shadow:0 3px 10px rgba(27,25,23,.10)}
#p-res .shot img{width:100%;height:210px;aspect-ratio:auto;object-fit:contain;background:#fff;padding:12px}
#p-res .shot .cap{flex:1}
#p-res .shot:first-child{box-shadow:inset 0 3px 0 var(--racc)}
#p-res .shot:first-child .cap{background:#FFFBF4}
#p-res .cap{color:var(--rbody);font-size:12.5px;line-height:1.6;padding:10px 12px}
#p-res .cap b{color:var(--rink)}
#p-res .lic{border-top:1px solid var(--rline)}
#p-res .lic.free{color:#2F6B3A;background:#F2F7F3}
#p-res .lic.edu{color:#8A6712;background:#FBF7EC}
#p-res .lic.clear{color:#A33D1E;background:#FCF2EE}
@media (max-width:700px){#p-res .shots.one .shot:first-child{grid-column:span 1}}

/* ===== family tree ===== */
.tree-head{padding:30px 0 22px;border-bottom:1px solid var(--line)}
.tree-head h2{margin:0 0 8px}
.tree-head code{font-family:var(--f-mono,monospace);font-size:12.5px;color:var(--accent);background:var(--panel);padding:1px 6px;border-radius:2px}
.tree-head p{margin:0;font-size:14.5px;color:var(--muted);max-width:74ch;line-height:1.75}
.branchkey{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
.branchkey span{display:flex;align-items:center;gap:7px}
.bdot{width:10px;height:10px;border-radius:50%;flex:none}

.node{position:relative;padding:22px 0 0}
.node.sepharad,.node.ashkenaz{padding-inline-start:26px;border-inline-start:2px solid var(--line)}
.node.sepharad{border-inline-start-color:#B5722B}
.node.ashkenaz{border-inline-start-color:#5C7391}

.nhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:12px}
.nyear{font-family:var(--f-display);font-size:26px;font-weight:900;color:var(--accent);line-height:1}
.nscene{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);padding:3px 8px;border-radius:2px}
.nplace{font-size:14px;color:var(--text);font-weight:600}
.nbranch{margin-inline-start:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.nbranch.sepharad{color:#C98A45}
.nbranch.ashkenaz{color:#8AA3C0}
.nbranch.trunk{color:var(--dim)}
.nbranch.merge{color:var(--accent)}

.chars{display:flex;gap:14px;flex-wrap:wrap}
.ch{width:152px;background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.slot{aspect-ratio:3/4;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim)}
.slot .ic{font-size:22px;line-height:1;opacity:.5}
.slot .lb{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ch .meta{padding:10px 11px}
.ch .role{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35}
.ch .age{font-size:11.5px;color:var(--muted);margin-top:2px}
.ch .code{font-size:9.5px;letter-spacing:.09em;color:var(--dim);margin-top:5px}
.ch.lead{border-color:var(--dim)}
.ch.lead .slot{background:#251C12}

.nochar{font-size:13px;color:var(--dim);font-style:italic;padding:10px 0}
.link{margin-top:12px;background:#22190F;border-inline-start:2px solid var(--accent);padding:9px 13px;font-size:13px;color:var(--text-2);line-height:1.6}
.link b{color:var(--accent);font-weight:600}
.link.gap{border-inline-start-color:#8A5A5A;background:#231616}
.link.gap b{color:#C88}

.refs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}
.rf{background:var(--panel-2);padding:9px 11px;min-height:54px}
.rf .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.rf .v{font-size:12px;color:var(--dim);font-style:italic;margin-top:4px}

.splitbar{margin:34px 0 6px;padding:13px 18px;background:var(--band);border-inline-start:3px solid var(--accent);font-size:14px;color:var(--text)}
.splitbar b{color:var(--accent);font-weight:600}
@media (max-width:820px){.refs{grid-template-columns:1fr 1fr}.ch{width:132px}}

.orig{display:flex;flex-direction:column;gap:18px;padding:28px 0 10px}
.orig .pg{display:block;width:100%;height:auto;border:1px solid var(--line)}

/* cover */
.cover{text-align:center;padding:22px 0 40px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,6vw,58px);line-height:1.06;margin:16px 0 8px;color:var(--text)}
.sub{font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--muted);margin:0 0 20px}
.spec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.site{margin-top:22px;font-size:12px;letter-spacing:.14em;color:var(--dim)}

h2{font-family:var(--f-display);font-size:27px;font-weight:900;color:var(--text);margin:46px 0 6px}
.lead{font-size:15px;color:var(--text-2);margin:0 0 22px;max-width:72ch}
.quote-box{border-inline-start:3px solid var(--accent);background:var(--panel);padding:18px 22px;margin:22px 0;font-size:15.5px;color:var(--text);line-height:1.75}
.quote-box b{font-weight:600}

.motifs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.motif{background:var(--panel);padding:20px 22px}
.motif .num{font-family:var(--f-display);font-size:26px;font-weight:900;color:var(--accent);line-height:1}
.motif h3{font-size:16px;font-weight:600;color:var(--text);margin:9px 0 7px}
.motif p{margin:0;font-size:14px;line-height:1.7;color:var(--text-2)}

.specs{margin-top:26px;border-top:1px solid var(--line)}
.specrow{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
.speck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-top:3px}
.specv{font-size:14.5px;line-height:1.75;color:var(--text-2)}
.specv b{color:var(--text);font-weight:600}

.act{display:flex;align-items:baseline;gap:14px;background:var(--band);border-inline-start:3px solid var(--accent);padding:12px 18px;margin:44px 0 0}
.act-n{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.act-name{font-family:var(--f-display);font-size:21px;font-weight:900;color:var(--text)}

.scene{background:var(--panel);border-bottom:1px solid var(--ground);padding:20px 22px}
.scene:nth-child(even){background:var(--panel-2)}
.s-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.s-n{font-family:var(--f-display);font-size:20px;font-weight:900;color:var(--dim);line-height:1}
.s-year{font-family:var(--f-display);font-size:29px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.01em}
.s-time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}
.s-dur{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--dim);border-radius:2px;padding:3px 9px}

.f{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:9px 0;border-top:1px solid var(--line)}
.f:first-of-type{border-top:0}
.fk{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;padding-top:4px}
.fv{font-size:14.5px;line-height:1.75;color:var(--text-2)}
.f.place .fv{color:var(--text);font-weight:600}
.f.emotion .fv{font-family:var(--f-display);font-style:italic;color:var(--muted)}

.note{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}
.note dt{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-top:3px}
.note dd{margin:0;font-size:14.5px;line-height:1.75;color:var(--text-2)}
.pull{font-family:var(--f-display);font-style:italic;font-size:20px;line-height:1.6;color:var(--text);text-align:center;padding:34px 24px;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.foot{margin-top:30px;font-size:11.5px;letter-spacing:.14em;color:var(--dim);text-align:center}

/* RTL pane */
.pane[dir="rtl"] .fk,
.pane[dir="rtl"] .speck,
.pane[dir="rtl"] .note dt{text-align:right}

@media print{
  @page{size:A4;margin:12mm}
  .bar{display:none!important}
  .wrap{max-width:none;padding:0}
  .scene,.motif,.act{break-inside:avoid}
  h2{break-after:avoid}
}
@media (max-width:820px){
  .motifs{grid-template-columns:1fr}
  .f,.specrow,.note{grid-template-columns:1fr;gap:4px}
}

/* ===== wardrobe ===== */
.wsp{width:100%;border-collapse:collapse}
.wsp th{text-align:start;width:74px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;vertical-align:top;padding:11px 0}
.wsp td{vertical-align:top;padding:11px 14px 11px 0;font-size:13.5px;line-height:1.7}
.wsp tr+tr th,.wsp tr+tr td{border-top:1px solid var(--line)}
.wch{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.wch span{font-size:11.5px;padding:4px 10px;border-radius:2px}
.wav{padding:14px 18px 0}
.wav h4{margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.wtbl{padding:4px 18px 14px}
@media (max-width:820px){.wsp th{width:58px;font-size:10px}.wsp td{font-size:12.5px}}

 motifs:[
  {t:"האור והשולחן",p:`כל סצנת שבת נפתחת או נסגרת בלהבה שנדלקת בין ערביים, והמצלמה אינה עוזבת את השולחן: בין התקופות, העולם שסביבו הוא שמשתנה. יש לסירוגין שני סוגי מעבר: חיתוכי התאמה על הלהבה, שבהם להבה של תקופה אחת "הופכת" ללהבה של הבאה, ומורפים רציפים, שבהם קירות, אור, חפצים, מאכלים ולבוש עוברים גלגול בתנועה אחת בזמן שהמשפחה נשארת ליד השולחן. החדר נוסע בזמן לנגד עינינו.`},

  {t:"הפמוטים",p:`זוג פמוטי כסף הוא החפץ המורש. הוא מופיע, מזדקן, מוסתר, נעטף, נטמן, נמצא ומצוחצח לאורך כל הסרט. כשהמשפחה מתפצלת בגלות (סצנה 6), הלהבה נחצית לשתיים: שני הענפים, ספרד ואשכנז, עושים דרכים מקבילות ונפגשים שוב סביב אותו שולחן בסצנה 25.`},
  {t:"הפנים החוזרות",p:`הצאצאים נושאים את אותן פנים: יש לשמר דמיון משפחתי, העיניים, חיוך אופייני, לאורך כל הדורות, כאילו פנים אחד חוצים את המאות. כלל סבירות: מזקינים את אותה דמות רק כשהפער בין הסצנות נכנס בתוך תוחלת חיי אדם, למשל הילדה שעל האונייה ב‑1905 היא האם הבוגרת של 1935; לרוחב מאות רחוקות, מי שאנו רואים הוא צאצא בעל אותם תווי פנים, ולעולם לא אותו אדם.`}

function render(lang, scenes, el){
  const t = T[lang];
  const durWord = lang==="he" ? "שניות" : "s";
  let h = `
    <div class="cover">
      <div class="kicker">${t.kicker}</div>
      <h1>${t.title}</h1>
      <p class="sub">${t.sub}</p>
      <div class="spec">${t.spec}</div>
      <div class="site">sixmillionvoices.org</div>
    </div>
    <h2>${t.threadH}</h2>
    <p class="lead">${t.threadLead}</p>
    <div class="quote-box">${t.pledge}</div>
    <div class="motifs">` +
    t.motifs.map((m,i)=>`<div class="motif"><div class="num">${i+1}</div><h3>${m.t}</h3><p>${m.p}</p></div>`).join("") +
    `</div><div class="specs">` +
    t.specs.map(x=>`<div class="specrow"><div class="speck">${x.k}</div><div class="specv">${x.v}</div></div>`).join("") +
    `</div><h2>${t.scenesH}</h2>`;

  t.acts.forEach(a=>{
    h += `<div class="act"><span class="act-n">${a.n}</span><span class="act-name">${a.name}</span></div>`;
    for(let n=a.from; n<=a.to; n++){
      const s = scenes[n-1];
      h += `<article class="scene">
        <div class="s-head"><span class="s-n">${n}</span><span class="s-year">${YEARS[lang][n-1]}</span><span class="s-time">${TIMES[n-1]}</span><span class="s-dur">${DURS[n-1]}${lang==="he"?" "+durWord:durWord}</span></div>
        <div class="f place"><div class="fk">${t.keys.place}</div><div class="fv">${s.place}</div></div>
        <div class="f"><div class="fk">${t.keys.visual}</div><div class="fv">${s.visual}</div></div>
        <div class="f emotion"><div class="fk">${t.keys.emotion}</div><div class="fv">${s.emotion}</div></div>
        <div class="f"><div class="fk">${t.keys.ref}</div><div class="fv">${s.ref}</div></div>
        ${s.trans ? `<div class="f"><div class="fk">${t.keys.trans}</div><div class="fv">${s.trans}</div></div>` : ""}
      </article>`;
    }
  });

  h += `<h2>${t.notesH}</h2><dl>` +
    t.notes.map(x=>`<div class="note"><dt>${x.k}</dt><dd>${x.v}</dd></div>`).join("") +
    `</dl><p class="pull">${t.pull}</p>
     <div class="foot">SIXMILLIONVOICES.ORG &middot; ONE TABLE ACROSS TIME</div>`;

  el.innerHTML = h;
}

render("he", HE, document.getElementById("p-he"));

function renderTree(el){
  let h=`<div class="tree-head">
    <h2>עץ המשפחה</h2>

    <div class="branchkey">
      <span><i class="bdot" style="background:var(--dim)"></i>גזע אחד, עד החורבן</span>
      <span><i class="bdot" style="background:#B5722B"></i>ענף ספרד</span>
      <span><i class="bdot" style="background:#5C7391"></i>ענף אשכנז</span>
      <span><i class="bdot" style="background:var(--accent)"></i>איחוד, 2026</span>
    </div>
  </div>`;

  TREE.forEach(nd=>{
    if(nd.n===7) h+=`<div class="splitbar"><b>כאן הלהבה מתפצלת.</b> מסצנה 6 ואילך שני ענפים נעים במקביל, ונפגשים שוב רק בסצנה 25, אחרי 1,900 שנה.</div>`;
    if(nd.n===25) h+=`<div class="splitbar"><b>כאן הענפים נסגרים.</b> נישואין מאחדים את שני הקווים, ושני זוגות הפמוטים עומדים יחד לראשונה.</div>`;

    h+=`<div class="node ${nd.branch}">
      <div class="nhead">
        <span class="nyear">${nd.year}</span>
        <span class="nscene">סצנה ${nd.n}</span>
        <span class="nplace">${nd.place}</span>
        <span class="nbranch ${nd.branch}">${BR[nd.branch]}</span>
      </div>`;

    if(nd.chars.length){
      h+='<div class="chars">'+nd.chars.map(c=>`
        <div class="ch${c.lead?" lead":""}">
          <div class="slot">
            ${c.code==="—"?"":`<img src="${P(nd.n)}/2-elements/${c.code}.png" alt="" onload="this.closest('.slot').classList.add('filled')" onerror="this.remove()">`}
            <span class="ic">◻</span><span class="lb">תמונה</span>
          </div>
          <div class="meta">
            <div class="role">${c.role}</div>
            <div class="age">${c.age}</div>
            <div class="code">${c.code}</div>
          </div>
        </div>`).join("")+'</div>';
    } else {
      h+='<div class="nochar">אין דמויות בסצנה זו.</div>';
    }

    if(nd.link) h+=`<div class="link">${nd.link}</div>`;
    if(nd.gap)  h+=`<div class="link gap">${nd.gap}</div>`;

    if(nd.chars.length){
      const d=P(nd.n);
      h+=`<div class="assets">
        <div class="as"><div class="k">רפרנסים</div><div class="thumbs">`+
          [1,2,3,4].map(i=>`<span class="tb"><img src="${d}/1-references/ref-${i}.jpg" alt="" onload="this.closest('.tb').classList.add('filled')" onerror="this.closest('.tb').remove()"></span>`).join("")+
        `<span class="empty-hint">ref-1.jpg …</span></div></div>
        <div class="as"><div class="k">רקע</div><div class="thumbs">
          <span class="tb wide"><img src="${d}/2.5-background/background.png" alt="" onload="this.closest('.tb').classList.add('filled')" onerror="this.closest('.tb').remove()"></span>
          <span class="empty-hint">background.png</span></div></div>
        <div class="as"><div class="k">חפצים</div><div class="thumbs">`+
          [1,2,3,4,5,6].map(i=>`<span class="tb"><img src="${d}/2-elements/prop-${i}.png" alt="" onload="this.closest('.tb').classList.add('filled')" onerror="this.closest('.tb').remove()"></span>`).join("")+
        `<span class="empty-hint">prop-1.png …</span></div></div>
        <div class="as"><div class="k">סרטון סופי</div><div class="thumbs">
          <video class="vid" src="${d}/3-video-after-ai/final.mp4" controls preload="metadata" onloadedmetadata="this.classList.add('filled')" onerror="this.remove()"></video>
          <span class="empty-hint">final.mp4</span></div></div>
      </div>`;
    }
    h+='</div>';
  });
  el.innerHTML=h;
}

const CAP={"met-467751-spanish-silver-15c.jpg": ["<b>פמוט השושלת הספרדית</b> — החפץ שעובר בדורות, מסצנה 8 ועד סצנה 25. פמוט כסף, ספרד, המאה ה‑15", "<b>The Sephardi dynasty’s candlestick</b> — the object handed down through the generations, from scene 8 to scene 25. Silver candlestick, Spain, 15th century"], "sinai-camp-fire-generated.jpg": ["מחנה במדבר בשקיעה: מדורה של קוצים וגללים, אוהלים משיער עיזים. הדמיה", "A desert camp at dusk: a fire of thorn brush and dung, goat-hair tents. Visualisation"], "megiddo-A28299-saucer-lamp.jpg": ["מנורת צלחת פתוחה, תל מגידו, 1300–1200 לפנה״ס", "Open saucer lamp, Tel Megiddo, 1300–1200 BCE"], "megiddo-A28301-pinched-spout.jpg": ["מנורת צלחת עם זרבובית מצוננת, מגידו", "Saucer lamp with pinched spout, Megiddo"], "met-34-126-62-lachish-lamp.jpg": ["מנורת צלחת, לכיש, המאה ה‑8–7 לפנה״ס", "Saucer lamp, Lachish, 8th–7th century BCE"], "carlos-X0027-herodian-lamp.jpg": ["נר הרודיאני, זרבובית אחת", "Herodian lamp, single nozzle"], "carlos-X0188-herodian-lamp.jpg": ["נר הרודיאני, חרס אדמדם", "Herodian lamp, reddish clay"], "met-32-150-163-ctesiphon-house-lamp.jpg": ["מנורת חרס ססאנית מבית מגורים, קטסיפון", "Sasanian clay lamp from a house, Ctesiphon"], "met-32-150-183-ctesiphon-sooted.jpg": ["מנורת חרס ססאנית עם סימני בעירה, קטסיפון", "Sasanian clay lamp with burn marks, Ctesiphon"], "alhambra-bronze-candil-despabiladera.jpg": ["קנדיל ברונזה עם מלקחיים בשרשרת, מדינת אלבירה, המאה ה‑10", "Bronze candil with chained wick-pick, Madinat Ilbira, 10th century"], "arqua-candil-piquera-12c.jpg": ["קנדיל חרס, המאה ה‑12", "Clay candil, 12th century"], "almeria-candil-four-nozzle.jpg": ["קנדיל בעל ארבע זרבוביות, אלמריה", "Four-nozzle candil, Almería"], "london-1374-hanging-star-lamp-12c.jpg": ["מנורת כוכב תלויה עם קערת טפטוף, המאה ה‑12", "Hanging star lamp with drip dish, 12th century"], "sister-haggadah-hanging-lamps-14c.jpg": ["הגדת האחות, קטלוניה, המאה ה‑14: מנורות תלויות", "Sister Haggadah, Catalonia, 14th century: hanging lamps"], "sister-haggadah-lamp-detail.jpg": ["פרט: גביע זכוכית על שלוש שרשראות", "Detail: glass beaker on three chains"], "museo-sefardi-candil-piquera.jpg": ["קנדיל חרס, המוזיאון הספרדי, טולדו", "Clay candil, Museo Sefardí, Toledo"], "alhambra-119028-candil-pie-alto-late15-16c.jpg": ["קנדיל מודחאר, סוף המאה ה‑15 – אמצע המאה ה‑16", "Mudéjar candil, late 15th – mid 16th century"], "cordoba-plain-candil-highres-CCBYSA.jpg": ["קנדיל חרס פשוט, קורדובה", "Plain clay candil, Córdoba"], "gonzalezmarti-DO6-candil-manises.jpg": ["קנדיל מזוגג, מניסס", "Glazed candil, Manises"], "jmg-silver-hanging-lamp.jpg": ["מנורה תלויה מכסף, המוזיאון היהודי של יוון", "Silver hanging lamp, Jewish Museum of Greece"], "jmg-kandil-glass-brass-hanging.jpg": ["קנדיל: גביע זכוכית בטבעת פליז על שלוש שרשראות", "Kandil: glass beaker in a brass ring on three chains"], "jmg-tin-hanging-lamp.jpg": ["מנורה תלויה מפח", "Tin hanging lamp"], "mahj-kandil-morocco-hero.jpg": ["קנדיל מרוקאי מפליז עם מוט תלייה", "Moroccan brass kandil with suspension rod"], "imj-371064-poland-brass-BEST.jpg": ["זוג פמוטי פליז, פולין", "Pair of brass candlesticks, Poland"], "yu-411047-russia-brass-petticoat.jpg": ["פמוט פליז מזרח־אירופי", "Eastern European brass candlestick"], "jmb-2004-69-0-candlestick-pair.jpg": ["זוג פמוטי כסף, גרמניה, 1888–1915", "Pair of silver candlesticks, Germany, 1888–1915"], "jmw-1026-vienna-jewish-parlour-CC0.jpg": ["סלון יהודי, וינה, 1899", "Jewish parlour, Vienna, 1899"], "jmb-aram-candlestick-refugee-family.jpg": ["פמוט כסף של משפחה שנמלטה מאירופה", "Silver candlestick of a refugee family"], "ushmm-1992-8-28-ossowski-pair-escaped-berlin.jpg": ["זוג פמוטים שיצא מברלין עם משפחת אוסובסקי, 1938", "Candlesticks carried out of Berlin by the Ossowski family, 1938"], "ushmm-1990-129-1-silver-1908.jpg": ["פמוט כסף, 1908", "Silver candlestick, 1908"], "ushmm-2008-328-1-slim-plain-pair.jpg": ["זוג פמוטים פשוט", "Plain pair of candlesticks"], "stettin-shelter-shabbat-1907-KEY.jpg": ["הדלקת נרות בבית מחסה למהגרים, שטטין, 1907", "Candle lighting in an emigrant shelter, Stettin, 1907"], "brass-candlestick-hero.jpg": ["פמוט פליז", "Brass candlestick"], "pressed-drinking-glasses-czech.jpg": ["כוסות שתייה מזכוכית מוטבעת", "Pressed-glass drinking glasses"], "yadvashem-33-1785-woman-lighting.jpg": ["הדלקת נרות: נר בפמוט ונר בכוס", "Candle lighting: one candle in a candlestick, one in a glass"], "DP-camp-candelabra-1945-a.jpg": ["פמוט שנעשה במחנה עקורים, 1945", "Candlestick made in a displaced persons camp, 1945"], "DP-camp-candelabra-1945-b.jpg": ["אותו פמוט, החלק השני", "The same candlestick, second part"], "tin-can-used-as-cup-1939.jpg": ["פחית שימורים ששימשה ככלי", "Tin can used as a vessel"], "wedel-candy-tin-DP-camp.jpg": ["פחית ממחנה עקורים", "Tin from a displaced persons camp"], "ushmm-59483-ebelsberg-tin-can-candle.jpg": ["שולחן שבת, מחנה עברסברג: נר בכוס ונר בפחית", "Sabbath table, Ebelsberg camp: a candle in a glass and one in a tin"], "elefant-silver-shabbat-candlesticks-early1950s.jpg": ["פמוטי כסף, ראשית שנות החמישים", "Silver candlesticks, early 1950s"], "soviet-majolica-candlestick-bystrushkin.jpg": ["פמוט סובייטי חילוני, מיוליקה", "Soviet secular candlestick, majolica"], "contemporary-candlesticks-2007-CCBYSA.jpg": ["פמוטי כסף עם נרונים בכוסות זכוכית", "Silver candlesticks with tea-lights in glass cups"], "modern-shabbat-candlesticks-CCBYSA.jpg": ["פמוטי כסף בני־זמננו", "Contemporary silver candlesticks"], "hostages-table-20oct2023-night.jpg": ["שולחן השבת בכיכר, 20 באוקטובר 2023", "The Sabbath table in the square, 20 October 2023"], "hostages-table-20oct2023-daylight.jpg": ["אותו שולחן, אור יום", "The same table, daylight"], "havdalah-candle-object-swiss-museum.jpg": ["נרות הבדלה קלועים, המוזיאון היהודי של שווייץ", "Braided Havdalah candles, Jewish Museum of Switzerland"], "braided-candle-ten-wicks-CCBYSA.jpg": ["נר הבדלה קלוע בוער, עשר פתילות", "Braided Havdalah candle alight, ten wicks"]};
const OBJ_EN={"3": {"name": "Open saucer lamp, pinched spout", "scr": "“Low fires, families gathered before their tents” — no Sabbath lamp in the script", "v": "Accurate as written.", "one": "A Sabbath lamp would be anachronistic here by some 1,400 years; Sabbath lighting is a rabbinic ordinance of around 200 CE.", "light": "Fire is carried, not made: a twig or straw is lit in the hearth embers and brought over cupped in the hand. It touches the <b>wick tip at the pinch</b>, never the oil or the body. The wick takes 3–8 seconds to catch."}, "4–6": {"name": "Herodian knife-pared lamp", "scr": "“Lights the <b>two wicks</b> of an oil lamp” · “the clay lamp with <b>two flames</b>”", "v": "Should be <b>one wick</b>: a clay lamp with a single nozzle and a single wick hole, burning olive oil.", "one": "The earliest source for two lights is Ra’aviah of Bonn, around 1200 CE; every lamp of the period examined has one wick.", "light": "Fire is brought from the hearth on a splinter or from another lit lamp. The flame comes in <b>low from the side to the wick tip at the end of the nozzle</b>. The lamp rests in the palm with the nozzle pointing away."}, "7": {"name": "Sasanian clay lamp", "scr": "“The <b>oil lamps</b> are lit” · “<b>multiple oil lamps</b>”", "v": "The lamp is right; the number is not. Should be <b>one lamp</b>. Several lamps lighting a room are fine; a ritual pair is not.", "one": "No distinctly Jewish Sabbath lamp is known from Sasanian Babylonia; households used the same clay lamps as their neighbours.", "light": "The same transfer from the hearth. <b>Sesame oil</b> rather than olive oil, a <b>flax</b> or folded-cloth wick. The wick must soak in oil beforehand or it will not light."}, "8": {"name": "Candil — Iberian oil lamp", "scr": "“Lights <b>silver candlesticks for the first time</b>, Andalusian filigree”", "v": "Should be a <b>candil</b>: clay for an ordinary home, cast bronze for a wealthy one, with a hinged lid and a chained wick-pick. The filigree can move to the lamp.", "one": "Maimonides, born in Córdoba in 1138, writes the laws of Sabbath lighting entirely in terms of oils and wicks; candlesticks appear in the 15th century.", "light": "A sulphur-tipped splint is lit at an ember. <b>The flame is laid along the whole exposed tip of the wick at the spout</b> and drawn along it, not dabbed at one point."}, "9": {"name": "Hanging star lamp", "scr": "“A <b>Judenstern</b> — a star-shaped oil lamp — <b>is lowered from the ceiling</b> and lit”", "v": "The object is right; the mechanism is not. Should hang from a <b>rigid iron rod</b>, with no rack and no chain, and it does not swing.", "one": "The toothed lowering rack dates from the 18th century and the name “Judenstern” from the 16th.", "light": "<b>The lamp stays hanging</b>, 80–100 cm above the table. Standing at the table, she reaches up with a splint at chin-to-forehead height and lights <b>from the farthest spout to the nearest</b>, so her hand never passes over a flame."}, "10": {"name": "Hanging lamp on three chains", "scr": "“Hands wrap the <b>silver candlesticks</b> in a shawl and hide them in a chest”", "v": "Should be <b>the hanging lamp, taken down from its chain</b>, or a silver kiddush cup.", "one": "The act is right — the Alhambra Decree forbade taking gold and silver out, so families hid them — only the object is wrong.", "light": null}, "11": {"name": "Candeeiro — Portuguese oil lamp", "scr": "“Lights <b>two candles inside a clay jar</b> so no light escapes to the street”", "v": "The concealment is right; the object is not. Should be <b>an oil lamp with new wicks</b>, in a jar open at the top rather than covered.", "one": "The light may not be extinguished, so what is hidden is the place — a cellar, an inner room, a closed door — not the flame.", "light": "<b>A clean lamp and new wicks</b>, exactly what the Inquisition’s Edict of Faith lists as a sign of Judaising. The flame touches the wick tip at the spout, and the lamp is left to <b>burn out on its own</b>."}, "12": {"name": "Hanging kandil — glass in a metal ring", "scr": "“The <b>silver candlesticks</b>, recovered from the chest, <b>back on the table</b>”", "v": "Should be <b>a lamp hanging above the table</b>. Silver is entirely right; what is wrong is that it stands.", "one": "The object taken out of the chest goes back on its hook and burns through the night.", "light": "<b>Water first (a quarter), then oil (three quarters), then the float, and only then the flame.</b> The splint goes <b>down into the mouth of the beaker</b> to the wick in the floating cork disc. The float is never lit before it is placed."}, "13": {"name": "Moroccan kandil", "scr": "<b>Not described in the script.</b> The grandmother is the lighting figure, but the light itself is not specified", "v": "Missing. Should be <b>a brass kandil hanging or hooked on the wall</b>, not standing on the table.", "one": "Two brass candlesticks do stand on the table, but <b>the blessing is said over the kandil</b>.", "light": "The wicks, twisted during the week from strips of old cloth, soak in oil ahead of time. <b>At the sound of the shofar</b> she goes to the lamp, <b>blesses and then lights</b>, reaching up and touching <b>each spout in turn</b>. One wick on weekdays; four or six on the Sabbath."}, "14–15": {"name": "Eastern European candlesticks", "scr": "“The mother lights the <b>silver candlesticks</b>” · “in every window, <b>two candles</b>”", "v": "The form is right; three details are not. Should be <b>brass</b> rather than silver, <b>three or four</b> candles rather than two, and <b>on the table</b> rather than in the window.", "one": "Candles in the window are a Hanukkah custom; on the Sabbath the lights belong on the table, which can still be seen through the window.", "light": "A match. <b>She lights, then blesses</b>, raising her hands to her eyes <b>without pausing to look at the flames</b>; she covers her eyes until the last word, so the first thing she sees is the light. In 1840 the wick does not consume itself: snuffers on the table, trimmed every 20–30 minutes."}, "16": {"name": "Spun silver candlesticks", "scr": "“On the marble sideboard, <b>the same old candlesticks</b>. The mother <b>removes her gloves</b> to light them”", "v": "The candlesticks are right; the setting is not. They should stand <b>on the table</b>, not a sideboard, and there are no gloves indoors.", "one": "In the one verified photograph of a Viennese Jewish parlour the candlesticks are on the table, and there are four.", "light": "As in the shtetl, but by 1900 the wick is braided and consumes itself: <b>no snuffers, and the flame stands still.</b>"}, "17": {"name": "Plain tapers in simple candlesticks", "scr": "“On the crowded deck, <b>a woman strikes a match</b>, shielding the flame with her body”", "v": "Should be <b>lit ashore</b>, in an emigrant shelter, where it is also photographed.", "one": "The steerage decks were electrically lit, and open flames were not permitted on board.", "light": "The same Ashkenazi sequence: match, lighting, hands to the eyes, blessing."}, "18": {"name": "The travelled candlesticks — the same pair as scene 17", "scr": "“The mother — <b>the girl from the ship</b>, now grown — <b>lights the candles</b>”", "v": "Accurate. <b>The same pair</b> wrapped in the shawl at the port of Hamburg in 1905.", "one": "The mother in Rio is the girl from the ship, so the candlesticks she lights are the ones that crossed with her — the continuity object of the act.", "light": "Ashkenazi sequence: match, lighting, hands to the eyes without looking at the flames, blessing. <b>White paraffin candles</b> with braided wicks, on the table."}, "19": {"name": "Improvised — candlestick and drinking glass", "scr": "“On a crate, <b>two candle stubs, no candlesticks</b>”", "v": "Nearly. The documented photograph shows <b>a mix</b>: one candle in a real brass candlestick, the other in a drinking glass.", "one": "", "light": "A candle in a glass does not stand by itself: <b>stove ash, melted wax at the bottom, or paper wedges</b>. The glass blocks the draught, so the flame stands tall and still."}, "20": {"name": "Improvised — glass and tin can", "scr": "“<b>Someone has found two candles</b>; someone else, flour for a small challah”", "v": "Accurate and documented.", "one": "A photograph from Ebelsberg shows a candle in a glass, a candle in a tin can, and a bottle from a relief shipment.", "light": "The tin is opaque, so <b>all the light goes upward</b>: the face is lit, the table is not. The tin gets hot enough to need a cloth."}, "21": {"name": "Candlesticks — the pair that travelled", "scr": "“The candlesticks, unwrapped from the same shawl, <b>return to the table by the open window</b>”", "v": "Accurate.", "one": "A survivor’s watercolour of an Israeli Sabbath table from the period shows exactly this, including the open window.", "light": "The ordinary Ashkenazi sequence."}, "22": {"name": "Soviet paraffin candle in a secular holder", "scr": "“<b>Candles lit</b> on the table”", "v": "The candles are right.", "one": "Soviet law forbade manufacturing Jewish religious articles, so the right object is an ordinary secular candle holder.", "light": "An ordinary match."}, "23": {"name": "Contemporary candlesticks", "scr": "“<b>The mother lights the candles</b> and the whole room changes temperature”", "v": "Accurate.", "one": "", "light": "A match or lighter, often <b>tea-lights in glass cups</b>, frequently on the kitchen counter rather than the dining table."}, "24": {"name": "Candles on the table in the square", "scr": "“Candles flicker in the wind”", "v": "Partly. There were candles on the table.", "one": "In both verified photographs from 20 October 2023 the candles are on the table, <b>but none shows them lit</b>.", "light": null}, "25–26": {"name": "Braided Havdalah candle", "scr": "“<b>Many wicks, one flame</b>” · “extinguished in the wine”", "v": "The image is exact; the order is reversed. The candle is put out <b>in wine poured onto the plate, after drinking</b>, not in a full cup.", "one": "“Many wicks” is a halakhic requirement: a candle with two wicks is called a torch (avukah).", "light": "<b>The wicks are not lit one by one.</b> A match is swept across the top; all wicks catch within 5–10 seconds, <b>then take 10–30 seconds</b> to lean together into one flame. Extinguishing: <b>one short hiss</b>."}};
const CONT={
 "14–15":["<b>החפץ המורש של הענף האשכנזי.</b> אותו זוג ממשיך לסצנות 16, 17, 18, 21 ו‑25.","<b>The heirloom of the Ashkenazi branch.</b> The same pair continues into scenes 16, 17, 18, 21 and 25."],
 "16":["<b>אותם פמוטים מסצנה 15.</b> ״אותם פמוטים ישנים, מצוחצחים״ — המשפחה עלתה במעמד, הפמוטים נשארו.","<b>The same candlesticks as scene 15.</b> “The same old candlesticks, freshly polished” — the family has risen; the candlesticks stayed."],
 "17":["<b>אותם פמוטים מסצנה 15.</b> כאן הם נעטפים בצעיף צמר ויוצאים לדרך.","<b>The same candlesticks as scene 15.</b> Here they are wrapped in a wool shawl for the crossing."],
 "18":["<b>אותם פמוטים מסצנה 15.</b> הגיעו לריו עם הילדה מהאונייה.","<b>The same candlesticks as scene 15.</b> They reached Rio with the girl from the ship."],
 "21":["<b>אותם פמוטים מסצנה 15.</b> ״נפרשו מאותו צעיף של המסע״.","<b>The same candlesticks as scene 15.</b> “Unwrapped from the same shawl of the crossing.”"],
 "8":["<b>מומלץ כחלק מהשרשרת: הפמוט שעובר בדורות של הענף הספרדי.</b> פמוט כסף ספרדי מהמאה ה‑15. אותו זוג ממשיך לסצנות 10, 12 ו‑25. <b>למה לא הקנדיל?</b> החפץ המדויק לקורדובה של המאה ה‑12 הוא מנורת שמן, אבל מנורה משתנה מדור לדור ולא נקראת כחפץ אחד על המסך. כדי שהצופה יזהה את אותו חפץ מקורדובה ועד סאו פאולו, בחרנו פמוט אחד לכל השרשרת — והוא מקדים את זמנו בכ‑300 שנה. זו בחירה עלילתית מודעת.","<b>Recommended as part of the chain: the candlestick handed down through the generations of the Sephardi branch.</b> A 15th‑century Spanish silver candlestick. The same pair continues into scenes 10, 12 and 25. <b>Why not the candil?</b> The accurate object for 12th‑century Córdoba is an oil lamp, but a lamp changes from generation to generation and does not read as one object on screen. So that the viewer recognises the same object from Córdoba to São Paulo, we chose a single candlestick for the whole chain — one that predates its own period by some 300 years. A deliberate storytelling choice."],
 "10":["<b>אותו פמוט מסצנה 8.</b> כאן הוא נעטף בצעיף ומוחבא בתיבה. המחקר הצביע על מנורה תלויה או גביע קידוש, אבל הרגע הזה — ההחבאה — עובד רק אם זה אותו חפץ שראינו בקורדובה וייצא שוב בסלוניקי.","<b>The same candlestick as scene 8.</b> Here it is wrapped in a shawl and hidden in a chest. The research pointed to a hanging lamp or a kiddush cup, but this moment — the hiding — only works if it is the same object we saw in Córdoba and will see again in Salonika."],
 "12":["<b>אותו פמוט מסצנה 8.</b> הוצא מן התיבה וחזר אל השולחן. בסלוניקי של המאה ה‑17 ההדלקה היא בקנדיל תלוי מעל השולחן, אבל מנורה תלויה שוברת את השרשרת: החפץ שיצא מהתיבה חייב להיות זה שנכנס אליה בטולדו.","<b>The same candlestick as scene 8.</b> Taken out of the chest and returned to the table. In 17th‑century Salonika the lighting is a hanging kandil, but a hanging lamp breaks the chain: what comes out of the chest has to be what went into it in Toledo."],

ather shoes) and **puzmakei** (stockings); in winter a **sarbala**: a Persian coat with no tzitzit"]], ["Child", ["**An oversized haluq**: hand-me-downs, and that is the norm (Shabbat 141b)", "**Head completely bare**: the sudra marks marriage, not childhood", "Barefoot in the courtyard or plain leather shoes / palm-fiber sandals; no tallit and no jewelry"]]], "key": "The sage = two layers of flowing cloth (haluq + gelima with tzitzit at the corners) and, on his head, a **draped sudra with both ends hanging over his face**: not a kippah and not a black-and-white tallit; the child beside him is entirely bare-headed, in a haluq too big for him.", "avoid": ["No kippah", "No black-and-white tallit", "No tzitzit under the shirt", "No shtreimel or kapote", "No Ottoman turban", "No Roman toga", "No crown or halo", "No buttons or zippers", "No printed cotton", "No uncovered hair on a married woman", "No stain on the sage's garment", "No sha'atnez (wool-linen mix)"], "im": [["M-3.jpg", "Dura-Europos on the Euphrates, 244–256, the Vision of Ezekiel: men in Parthian-Persian dress, belted tunic with a slit, trousers and leggings, no marks of royalty", 1, "מוקדם מהתקופה", "ציור קיר"], ["W-2.jpg", "Dura-Europos on the Euphrates, 244–256: the widow of Zarephath, a plain woman in a long tunic with a radid (head mantle), holding a child", 1, "מוקדם מהתקופה", "ציור קיר"]], "hero": []}, "8": {"y": "12th century: but in practice the 10th–11th", "pl": "Córdoba: The Golden Age", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["Layers: **ghilala** (inner shift) ← **sirwal** (trousers) ← gown / **jubba** with a wide open sleeve ← **rida'** (wrap) over the shoulders", "Fabric and color: striped silk and linen, gilding worked into the cloth. Pomegranate red, cloud blue, pistachio, emerald. **White is forbidden to women**", "Head and feet: **mi'jar/khimar** (head veil) matched to the gown, face uncovered indoors; barefoot on the carpet"]], ["Man", ["Layers: **ghilala** ← **qamis** (shirt) ← **jubba** (the standard Córdoban robe) ← **rida'/mitraf** (mantle) when going out", "Fabric and color: turquoise, bottle green, coral, rust, blue-black. Stripes and checks, a gilded **tiraz** band on one garment only", "Head and feet: **bare head or a red/green wool cap (ghifara)**, not a turban; barefoot indoors"]], ["Child", ["Layers: a single **qamis**, and that's all. No robe, no wrap", "Fabric and color: the same palette, plainer cloth, **no tiraz**", "Head and feet: head always bare, hair down to the chin; barefoot"]]], "key": "The Jewish family is dressed **exactly** like its Muslim neighbors: zero distinguishing mark, zero badge, zero kippah as a symbol. Wealth is measured in striped silk, in gilding on the cloth and in layers, and the heads are left **bare**, not turbaned.", "avoid": ["Large turbans on everyone", "Kippah as a Jewish marker", "Yellow badge / badge of shame", "Tallit on the table", "White gown on the woman", "Biblical sackcloth robes", "Ashkenazi black caftan", "European Gothic silhouette", "Aladdin harem pants", "Bedouin desert look"], "im": [["W-4.jpg", "Golden Haggadah, Catalonia, ca. 1320: a Jewish home before Passover, the mother sweeping, a girl cleaning, a child in a short tunic and the father searching for hametz", 1, "מאוחר מהתקופה", "כתב יד"], ["M-3.jpg", "Sister Haggadah, Spain, 14th c.: a Jewish congregation in a synagogue, men and women in plain hooded robes and a child in a red tunic", 1, "מאוחר מהתקופה", "כתב יד"]], "hero": []}, "9": {"y": "13th century", "pl": "The Rhineland (Ashkenaz)", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["**Three layers**: linen shift → ankle-length wool gown, narrow sleeve → mantle over it, brooch at the throat", "**Fabric and color**: wool and linen only. Madder red, turquoise blue, ochre, olive green, cream: no black and no saturated colors", "**Head and feet**: if married: a white linen veil over head and neck; the daughter, hair uncovered. Soft leather shoe, hidden"]], ["Man", ["**Three layers**: linen shift → ankle-length wool tunic, narrow leather belt → mantle against the cold", "**Fabric and color**: the same wool, the same palette as the woman. No buttons, no modern seams", "**Head and feet**: **Judenhut** (pointed Jewish hat): a stiff round brim + a cone tipped with a knob, cream-white or ochre. Pointed leather shoe"]], ["Child", ["**A scaled-down version of the adults**: there is no children's fashion. A long gown for the little ones, a short tunic + hose for the boy", "**Fabric and color**: the same wool, the same palette, no ornament", "**Head**: **none: no Jewish hat.** For the girl, hair uncovered, no veil"]]], "key": "**Exactly the same Gothic dress as the Christian neighbors in the same town.** The only difference in frame is the pointed hat on the father's head. Do not invent a \"Jewish costume\": and do not add a shtreimel, a kapote or side-curls.", "avoid": ["Shtreimel", "Black kapote", "Tzitzit hanging out", "Modern kippah", "Curled side-locks", "Sheitel (wig)", "Star of David", "Yellow badge", "Turban / djellaba", "Rows of buttons", "Uniform black"], "im": [["W-1.jpg", "Women in white veils, men in pointed hats: Tripartite Mahzor, ca. 1322 (a generation after the scene)", 1, "בן התקופה", "כתב יד"], ["W-3.jpg", "A woman fully wrapped in a linen veil: Leipzig Mahzor, ca. 1310 (slightly later)", 1, "בן התקופה", "כתב יד"], ["M-4.jpg", "Man in a pointed Jewish hat (Judenhut), blue robe with pink lining and a fur collar: German manuscript, 13th c. **Source not fully verified**, the manuscript's name and an exact citation were not traced", 1, "בן התקופה", "כתב יד"]], "hero": []}, "10": {"y": "1492", "pl": "Toledo: The Expulsion from Spain", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["**Layers**: white linen shift → saya (gown) with a laced bodice and a full skirt → manto for the street", "**Fabric and color**: muted wool: brown, rust, dark green, gray. **No silk, no sheen, no gold**", "**Head and feet**: a married woman always in a white toca; a girl with loose hair. Leather shoes, ankle boots for the road"]], ["Man", ["**Layers**: white shirt → jubón (doublet) → calzas (hose) → short sayo (for the young man) or a **long ropa/tabardo** (the father)", "**Fabric and color**: coarse dark wool; red or dark calzas. Silk and grana (scarlet dye) are forbidden to Jews by law", "**Head and feet**: **a Castilian bonete or capirote, not a bare kippah**; hood/capuz for the road; leather shoes"]], ["Child", ["**Layers**: small adults: exactly the same cut, plain wool, no ornament", "**Fabric and color**: brown or dark green; the white shift shows at the neck and the sleeve", "**Head and feet**: boy: a small bonete. Girl: hair with a cloth band, sometimes a veil. Dusty leather shoes"]]], "key": "The Jewish family in Toledo 1492 looks **exactly like the Christian neighbors**: the tragedy is that you cannot tell them apart. Any \"Jewish costume\" beyond a small red cloth roundel on the right shoulder is a mistake.", "avoid": ["No yellow Star of David", "No conical hat", "No Andalusi turban", "No shtreimel or kapote", "No bare kippah", "No tallit in the street", "No silk or brocade", "No ruffs or hoops", "No suitcases or coins"], "im": [["M-5.jpg", "Spanish manuscript in the style of the Spanish haggadot (Catalonia, ca. 14th c.): a man in a green hat and blue robe raising a cup (Kiddush?), a child with a staff beside him. **Tentative identification**, the exact manuscript was not verified", 1, "מוקדם מהתקופה", "כתב יד"]], "hero": []}, "11": {"y": "1540", "pl": "Lisbon: The Conversos", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["Layers: white linen shift → stiffened bodice that **flattens the chest** → pleated skirt → smooth verdugado (farthingale) cone → open gown with hanging funnel sleeves", "Fabric and color: wool and linen, **black** or muted brown-black, no embroidery and no gold; white only at the neck and the wrists", "Head and feet: a wrapped white linen toucado (a married woman is always covered) + a black manto in the street; flat leather shoes; **a visible cross or rosary**"]], ["Man", ["Layers: linen shirt with a low standing collar → close-fitting black gibão (doublet) → melon-volume calças + knee hose → **a long black robe** (roupão) or a short capa", "Fabric and color: wool, **black above all**; a thin line of white linen at the neck and the hands only", "Head and feet: a **barrete**, a soft flat black cap, short forked beard; flat broad-toed leather shoes; leather belt with a purse"]], ["Child", ["Layers: **an exact miniature of an adult** from about age 6; before that, a plain long gown for both sexes", "Fabric and color: the same dark palette, plainer fabrics, zero luxury and zero cheerful color", "Head and feet: the girl: braided and coiled hair or a simple linen covering; indoors sometimes barefoot"]]], "key": "The family wears **exactly** what the Christian crowd in the street wears: not one detail gives them away. The danger is not a Jewish garment, but **a clean linen shift on a Friday evening**, visible at the neck and the hands, which is what they were denounced for.", "avoid": ["Starched ruff (1555+)", "Wheel farthingale (1580+)", "Puffed pumpkin breeches", "Peascod belly", "Kippah, tallit, Star of David", "East European kerchief", "Married woman with bare hair", "Sanbenito on the family", "Gold and embroidery", "Saturated, cheerful colors"], "im": [["M-2.jpg", "A crowd of Lisbon men, 1536-39; the archers at the edges are stylized executioners: ignore them", 0, "בן התקופה", "ציור"], ["M-3.jpg", "A real Lisbon street: the procession crowd. 1570-80, scale down the collars and hats", 0, "מאוחר מהתקופה", "ציור"], ["W-3.jpg", "Ordinary Portuguese women at home, 1530-40: the real reference for the mother in the cellar", 0, "בן התקופה", "ציור"], ["M-4.jpg", "\"This is how the men generally go about in Portugal\" – a flat cap and a wide dark robe. Weiditz 1529, 11 years before the scene", 0, "מוקדם מהתקופה", "כתב יד"], ["C-2.jpg", "An ordinary Iberian child (Castile 1529) – short tunic, hose, bare head. For Lisbon – in a dark color", 0, "מוקדם מהתקופה", "כתב יד"]], "hero": []}, "12": {"y": "17th century", "pl": "Salonika", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["Layers: thin white chemise, inner salmon entari (long buttoned robe), outer navy buttoned entari, long woven sash", "Fabric and color: **heavy Salonikan wool**; navy, black, salmon, burgundy, mustard. **No green**", "Head and feet: white kerchief over a pointed cap + **a red ribbon trailing down the back**, zero visible hair, dark flat shoe"]], ["Man", ["Layers: long entari buttoned from neck to waist, wide kuşak (sash), dark open outer robe", "Fabric and color: indigo/teal underneath, olive-brown over it; **no green**, no sheen", "Head and feet: **stiff dark-red hat with a light brim** (1599 decree), full beard, dark flat shoe"]], ["Child", ["Layers: miniature adults: a small entari, a cloth sash. There is no children's fashion in the 17th century", "Fabric and color: the most worn fabric in the frame; clothes pass from sibling to sibling, visible wear", "Head and feet: boy in a soft cloth cap (takke), not in the red hat; girl in a kerchief from a young age"]]], "key": "The law required dark dress in public, but **permitted color on Shabbat inside the quarter**: so the color here is lawful; what does not change even on Shabbat is the head covering: **a dark-red hat for the man, not a white turban**.", "avoid": ["Yellow badge", "Large white turban", "Any green", "Yellow shoe", "Cone hat", "Shtreimel and payot", "Modern yarmulke", "Tallit at the table", "Spanish ruff", "19th-century kofya", "Aniline colors", "Glossy silk"], "im": [["M-1.jpg", "Rålamb 1657, \"Iudeus\": the red hat of the 1599 decree. This is the hat for the frame", 1, "בן התקופה", "כתב יד"], ["M-2.jpg", "Nicolay 1567, \"Marchant Juif\": for the body cut only. Do not copy the turban", 1, "מוקדם מהתקופה", "תחריט"], ["M-3.jpg", "Recueil Ferriol 1714, \"Juif\": the grandfather: a plain dark robe over a striped entari and a cloth sash", 1, "מאוחר מהתקופה", "תחריט"], ["W-1.jpg", "Rålamb 1657, \"Hebrea\": navy entari over salmon, red ribbon at the back", 1, "בן התקופה", "כתב יד"], ["W-2.jpg", "Rålamb 1657, \"Iudæa\": tall white coif, black robe, red cuffs", 1, "בן התקופה", "כתב יד"], ["W-4.jpg", "La Chapelle, ca. 1648: \"Femme Juifve\" in Istanbul: a plain dark floor-length robe, a kerchief tied over a tall coif. Everyday dress, no fur and no embroidery", 1, "בן התקופה", "תחריט"]], "hero": []}, "13": {"y": "1800", "pl": "Fez, Morocco: the mellah (Jewish quarter)", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["Layers: linen chemise with very long sleeves → kaftan to the hip, open at the chest → green skirt → gold-and-silk sash", "Fabric and color: **color is free**, velvet or wool, **gold embroidery on the borders only** (not a field of gold, that is a wedding)", "Head and feet: married: **red silk headscarf** + ribbon; unmarried: braid visible. **No stockings**, red gold-embroidered babouches (slippers)"]], ["Man", ["Layers: wide serwal (loose trousers) → white chemise → dark kaftan cinched at the waist → **black hooded wool burnous (cloak)**", "Fabric and color: **black by force of law.** No color, no gold, no pattern", "Head and feet: **black skullcap/chechia**, shaved head, long beard; **black babouches, not yellow**"]], ["Child", ["Layers: boys: dark ankle-length kaftan + serwal + white chemise at the collar. Girls: a small colorful kaftan", "Fabric and color: boys dark like the father; **the girls are the freest color in the frame**", "Head and feet: boys: a small black skullcap. Girls: braid visible. **Barefoot in the courtyard, that is correct, do not fix it**"]]], "key": "**The men are in black because the law requires it, the women in color because women were permitted: and this is documented word for word. And the keswa el-kbira (Moroccan ceremonial gown) is a wedding garment: on an ordinary Shabbat it is a , worn fabric: a hand-me-down garment", "Soft cloth cap · **long, unkempt payot (sidelocks)** · low shoe or barefoot"]]], "key": "**No man in long trousers and boots**: in 1840 it is knee breeches, stockings and a low flat shoe, in the mud.", "avoid": ["Ankle-length trousers", "High boots", "Shtreimel at the market", "Shterntikhl at the market", "Silk and velvet", "Short German coat", "1930s Vishniac look", "Clean clothes", "Short kitchen apron"], "im": [["C-1.jpg", "Warsaw 1841 · boy: soft cap, payot, worn coat", 1, "בן התקופה", "תחריט"], ["C-2.jpg", "Warsaw 1841 · child in the street: long coat, soft cap; barefoot at the side", 1, "בן התקופה", "תחריט"], ["M-1.jpg", "Warsaw 1841 · peddlers: kapote, gartel, low shoe: the central frame", 1, "בן התקופה", "תחריט"], ["M-2.jpg", "Warsaw 1841 · merchants: weekday fur and felt hats", 1, "בן התקופה", "תחריט"], ["M-3.jpg", "Galicia 1821 · color: kaftan, knee breeches, stockings, low shoe", 1, "מוקדם מהתקופה", "תחריט"], ["W-1.jpg", "Lithuania 1846 · shawl from head to ground, headscarf, pearls", 1, "מאוחר מהתקופה", "תחריט"], ["W-2.jpg", "Galicia 1821 · long apron over a skirt: festive colors", 1, "מוקדם מהתקופה", "תחריט"], ["W-3.jpg", "Warsaw 1881 (late) · worn texture, layers, brown shawl", 1, "מאוחר מהתקופה", "ציור"]], "hero": []}, "15": {"y": "1840", "pl": "Shtetl: Shabbat Evening", "vt": "Full wardrobe", "na": "", "rows": [["Woman", ["**Layers**: long long-sleeved dress + brusttukh (chest panel) over the bodice + floor-length apron + fur-lined yupe (coat) in winter", "**Fabric and color**: brown or black, but on Shabbat a finer fabric; **white** stockings instead of black; a single string of pearls", "**Head and feet**: close-fitting kupke (cap) + haarband across the forehead + **a stiff white shleyer (veil)** falling back; low leather shoe"]], ["Man", ["**Layers**: chemise + tallit katan + kamizelke (vest) + ankle-length kapote + **gartel** (woven sash) wound over it", "**Fabric and color**: black as on weekdays, but **glossy silk/satin** that reflects the candles; white hose, festive white yarmulke", "**Head and feet**: yarmulke, and over it a fur hat that comes out only on Shabbat; **knee breeches**; low leather shoe, not a boot"]], ["Child", ["**Boy**: a spencer (short double-breasted jacket) or a miniature kapote + black yarmulke + payot (sidelocks)", "**Girl**: **head uncovered, two braids**, and on a festival a flower woven into the hair. The absolute opposite of the mother", "**The rule**: there are no 'children's clothes': this is a miniature of the adult garment, except for the spencer"]]], "key": "**Same color, different fabric.** The Shabbat garment is the same black kapote: but in silk or satin, so it is **glossy and reflects the candle flames**, while the weekday garment swallows light. And for anyone with no second fabric, the Shulchan Aruch gives the solution: the garment **hangs loose and long**, in the manner of the wealthy who sit at home.", "avoid": ["Tallit gadol in the evening", "Shtreimel on everyone", "Sheitel (wig)", "High boots", "Ankle-length trousers", "Necktie or suit", "Shterntikhl on a poor woman", "Present-day headscarf style", "New, pressed clothes"], "im": [["C-1.jpg", "late · small fur hat and payot: a boy in a Hasidic family", 1, "מאוחר מהתקופה", "ציור"], ["M-1.jpg", "late ~1910 · shtreimel + glossy satin kapote, no tallit: the Hasidic option", 1, "מאוחר מהתקופה", "ציור"], ["W-2.jpg", "late ~1920 · white head covering and shleyer at candle lighting: the correct silhouette for the mother", 1, "מאוחר מהתקופה", "ציור"], ["C-2.jpg", "late · black velvet yarmulke: a boy in a balebos (ordinary householder) home", 1, "מאוחר מהתקופה", "ציור"], ["M-2.jpg", "exact ~1843 · low round fur hat: the non-Hasidic option for the father", 1, "בן התקופה", "ציור"], ["M-3.jpg", "undated · full silhouette: gartel, knee breeches, low shoe", 1, "תיארוך לא ידוע", "תחריט"], ["W-4.jpg", "Poland 1846 · a Hasid and his wife: wrapped headscarf, striped dress, long apron; the man in a fur hat, long coat, sash, stockings and low shoe: an ordinary couple, complete clothes", 1, "בן התקופה", "תחריט"], ["M-4.jpg", "Warsaw 1846 · a Jewish balebos: fur hat, long buttoned coat with a belt, stockings and low shoe: the non-Hasidic option for the father", 1, "בן התקופה", "תחריט"], ["W-5.jpg", "Kraków 1856 · an older Jewish woman at home: white lace cap and headscarf, dark dress and apron, shawl over the shoulders", 1, "מאוחר מהתקופה", "אקוורל"]], "hero": []}, "16": {"y": "1900", "pl": "Vienna", "vt": "Full wardrobe", "na": "", "rows": [], "key": "The young mother: a tailored bourgeois day dress with a white lace bodice and buttons, a high closed collar, no conspicuous jewelry. The grandfather: a dark three-piece town suit, a well-groomed beard — no Eastern European marker at all (no kapote, no fur hat).", "avoid": ["Nazi-era markers", "Shtetl/religious dress (kapote, shtreimel)", "Aristocratic/court dress", "Conspicuous jewelry or evening silk", "Eastern European head covering on a man"], "im": [["W-1.jpg", "A bourgeois mother with her daughter in a garden: dark day dress, white lace bodice. Pinkau family, Germany ~1900. Not identified as Jewish — a reference for class and cut only", 0, "בן התקופה", "צילום"], ["W-2.jpg", "A mother with a high collar and a brooch, holding a girl's hand. Sohn-Rethel family, Germany ~1900. Not identified as Jewish", 0, "בן התקופה", "צילום"], ["M-1.jpg", "A bald, bearded grandfather embracing a granddaughter, dark suit. Sohn-Rethel family, Germany ~1900. The closest match found for the role of \"the smiling grandfather\"", 0, "בן התקופה", "צילום"]], "hero": []}, "17": {"y": "1905", "pl": "Port of Hamburg", "vt": "Full wardrobe", "na": "", "rows": [], "key": "Practical travel clothing, less elegant than Scene 16: dark coat/blouse with a high collar, headscarf against the wind, simple dark skirt/dress, closed shoes. The girl: dark plaid dress to the knee, dark stockings.", "avoid": ["Elegant clothing like Scene 16", "Exaggerated folkloric \"national costume\" that photographers dressed immigrants in for the shot — not what they actually wore", "Conspicuous jewelry", "Uniforms or any official insignia", "Delicate shoes"], "im": [["W-1.jpg", "Russian Jewish girl, dark headscarf and heavy dark travel coat. Ellis Island, 1905 (attribution uncertain between Lewis Hine and Augustus Sherman)", 1, "בן התקופה", "צילום"], ["W-2.jpg", "Young woman, dark blouse with a high collar and a brooch. The Cohn family, embarked at Hamburg in June 1904, same shipping line, one year before the scene", 1, "בן התקופה", "צילום"], ["M-1.jpg", "Elderly grandfather/father, bowler hat, dark coat, full white beard. The Cohn family, 1904", 1, "בן התקופה", "צילום"], ["C-1.jpg", "Girl of about 8-10, dark plaid dress, dark stockings. The Cohn family, 1904 — the best match for the role of \"the girl on deck\"", 1, "בן התקופה", "צילום"]], "hero": []}, "18": {"y": "1935", "pl": "Praça Onze, Rio de Janeiro", "vt": "Full wardrobe (requires simplification to at-home dress)", "na": "", "rows": [], "key": "A Jewish immigrant family, comfortable but not wealthy. The references are communal holiday/going-out dress from 1934: printed dress and cloche hat for the woman, a dark suit or a tropical white one for the man. For the at-home version: remove hats and outer layers and shorten the sleeves — the scene explicitly says \"tropical heat\".", "avoid": ["Jewelry, furs or silk — markers of wealth", "Transplanted European aristocratic dress", "Anachronistic clothing (post-1940s)", "Holiday hats indoors during candle lighting", "Long sleeves or heavy fabrics"], "im": [["W-1.jpg", "Woman of the Jewish community of Rio de Janeiro, ceremony at the Israelite Cemetery in Inhaúma, April 11, 1934, photo by Augusto Malta: printed dress and cloche hat — remove the hat and the outer layer for the at-home version", 1, "בן התקופה", "צילום"], ["M-1.jpg", "Man in a dark suit and tie, same photograph, 1934: an example of restrained men's holiday dr const tabs = {script:document.getElementById("t-script"), res:document.getElementById("t-res"), wear:document.getElementById("t-wear")};

var VIEW="script";
function show(v){
  VIEW=v;
  Object.keys(tabs).forEach(k=>{ if(tabs[k]) tabs[k].setAttribute("aria-selected", String(k===v)); });
  panes.en.hidden   = !(v==="script" && LANG==="en");
  panes.he.hidden   = !(v==="script" && LANG!=="en");
  if(panes.tree) panes.tree.hidden = (v!=="tree");
  panes.res.hidden  = (v!=="res");
  panes.wear.hidden = (v!=="wear");
  document.documentElement.lang = (LANG==="en"?"en":"he");
  document.body.classList.toggle("res-mode",  v==="res");
  document.body.classList.toggle("wear-mode", v==="wear");
  window.scrollTo({top:0});
}
function setLang(l){
  LANG=l; WL=l;
  document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on", b.dataset.lang===l));
  tabs.script.textContent = (l==="en"?"Script":"תסריט");
  if(tabs.tree) tabs.tree.textContent = (l==="en"?"Family Tree":"עץ משפחה");
  tabs.res.textContent  = (l==="en"?"Candle Research":"מחקר נרות");
  tabs.wear.textContent = (l==="en"?"Period Dress":"לבוש תקופתי");
  panes.wear.setAttribute("dir", l==="en"?"ltr":"rtl");
  panes.wear.setAttribute("lang", l==="en"?"en":"he");
  renderWear(panes.wear);
  renderRes(panes.res);
  show(VIEW);
}
document.querySelectorAll("#langsw button").forEach(b=>{
  b.addEventListener("click",()=>setLang(b.dataset.lang));
});
tabs.script.addEventListener("click",()=>show("script"));
tabs.res.addEventListener("click",()=>show("res"));
tabs.wear.addEventListener("click",()=>show("wear"));
setLang(LANG);
